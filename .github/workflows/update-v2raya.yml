name: Update v2rayA, v2ray-core and xray-core

on:
  schedule:
    # 每周五 UTC 2:00 (北京时间 10:00) 检查更新
    - cron: '0 2 * * 5'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      force:
        description: '强制构建（忽略版本检查）'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      create_release:
        description: '是否发布 pre-release'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Get latest v2rayA version
      id: v2raya
      run: |
        LATEST=$(curl -s https://api.github.com/repos/v2rayA/v2rayA/releases/latest | jq -r '.tag_name' | sed 's/^v//')
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest v2rayA version: $LATEST"
        
    - name: Get latest v2ray-core version
      id: v2ray
      run: |
        LATEST=$(curl -s https://api.github.com/repos/v2fly/v2ray-core/releases/latest | jq -r '.tag_name' | sed 's/^v//')
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest v2ray-core version: $LATEST"
        
    - name: Get latest xray-core version
      id: xray
      run: |
        LATEST=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.tag_name' | sed 's/^v//')
        echo "version=$LATEST" >> $GITHUB_OUTPUT
        echo "Latest xray-core version: $LATEST"
        
    - name: Get current upstream versions
      id: current
      run: |
        CHANGELOG=$(grep '^changelog' manifest | sed 's/^changelog.*= //')
        
        # 从 changelog 中提取版本号
        # 格式: Update to v2rayA X.X.X with v2ray-core X.X.X and xray-core X.X.X
        CURRENT_V2RAYA=$(echo "$CHANGELOG" | grep -oP 'v2rayA \K[^ ]+' || echo "")
        CURRENT_V2RAY=$(echo "$CHANGELOG" | grep -oP 'v2ray-core \K[^ ]+' || echo "")
        CURRENT_XRAY=$(echo "$CHANGELOG" | grep -oP 'xray-core \K[^ ]+' || echo "")
        
        echo "v2raya=$CURRENT_V2RAYA" >> $GITHUB_OUTPUT
        echo "v2ray=$CURRENT_V2RAY" >> $GITHUB_OUTPUT
        echo "xray=$CURRENT_XRAY" >> $GITHUB_OUTPUT
        
        echo "Current upstream versions from changelog:"
        echo "  v2rayA: $CURRENT_V2RAYA"
        echo "  v2ray-core: $CURRENT_V2RAY"
        echo "  xray-core: $CURRENT_XRAY"
        
    - name: Check if update needed
      id: check
      run: |
        FORCE_UPDATE="${{ github.event.inputs.force || 'false' }}"
        if [ "$FORCE_UPDATE" = "true" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Force update enabled"
        elif [ "${{ steps.v2raya.outputs.version }}" != "${{ steps.current.outputs.v2raya }}" ] || \
             [ "${{ steps.v2ray.outputs.version }}" != "${{ steps.current.outputs.v2ray }}" ] || \
             [ "${{ steps.xray.outputs.version }}" != "${{ steps.current.outputs.xray }}" ]; then
          echo "needs_update=true" >> $GITHUB_OUTPUT
          echo "Update needed:"
          echo "  v2rayA: ${{ steps.current.outputs.v2raya }} -> ${{ steps.v2raya.outputs.version }}"
          echo "  v2ray-core: ${{ steps.current.outputs.v2ray }} -> ${{ steps.v2ray.outputs.version }}"
          echo "  xray-core: ${{ steps.current.outputs.xray }} -> ${{ steps.xray.outputs.version }}"
        else
          echo "needs_update=false" >> $GITHUB_OUTPUT
          echo "No update needed (all components are up to date)"
        fi
        
    - name: Download v2rayA binary
      if: steps.check.outputs.needs_update == 'true'
      run: |
        VERSION="${{ steps.v2raya.outputs.version }}"
        wget "https://github.com/v2rayA/v2rayA/releases/download/v${VERSION}/v2raya_linux_x64_${VERSION}" -O app/v2raya
        chmod +x app/v2raya
        
    - name: Download v2ray-core
      if: steps.check.outputs.needs_update == 'true'
      run: |
        VERSION="${{ steps.v2ray.outputs.version }}"
        wget "https://github.com/v2fly/v2ray-core/releases/download/v${VERSION}/v2ray-linux-64.zip" -O v2ray.zip
        unzip -o v2ray.zip -d v2ray-temp
        
        # 只保留需要的文件
        mv v2ray-temp/v2ray app/v2ray/v2ray
        chmod +x app/v2ray/v2ray
        
        # 更新 dat 文件
        mv v2ray-temp/geoip.dat app/v2ray/geoip.dat
        mv v2ray-temp/geosite.dat app/v2ray/geosite.dat
        
        # 清理临时文件
        rm -rf v2ray-temp v2ray.zip
        
    - name: Download xray-core
      if: steps.check.outputs.needs_update == 'true'
      run: |
        VERSION="${{ steps.xray.outputs.version }}"
        wget "https://github.com/XTLS/Xray-core/releases/download/v${VERSION}/Xray-linux-64.zip" -O xray.zip
        unzip -o xray.zip -d xray-temp
        
        # 创建 xray 目录（如果不存在）
        mkdir -p app/xray
        
        # 只保留需要的文件
        mv xray-temp/xray app/xray/xray
        chmod +x app/xray/xray
        
        # 更新 dat 文件
        mv xray-temp/geoip.dat app/xray/geoip.dat
        mv xray-temp/geosite.dat app/xray/geosite.dat
        
        # 清理临时文件
        rm -rf xray-temp xray.zip
        
    - name: Update manifest version
      if: steps.check.outputs.needs_update == 'true'
      run: |
        # 生成日期版本号 (YY.M.D)
        DATE_VERSION=$(date +%y.%-m.%-d)
        V2RAYA_VERSION="${{ steps.v2raya.outputs.version }}"
        V2RAY_VERSION="${{ steps.v2ray.outputs.version }}"
        XRAY_VERSION="${{ steps.xray.outputs.version }}"
        sed -i "s/^version.*$/version         = ${DATE_VERSION}/" manifest
        sed -i "s/^changelog.*$/changelog       = Update to v2rayA ${V2RAYA_VERSION} with v2ray-core ${V2RAY_VERSION} and xray-core ${XRAY_VERSION}/" manifest
        
        echo "Updated manifest version to ${DATE_VERSION}"
        
    - name: Update README
      if: steps.check.outputs.needs_update == 'true'
      run: |
        V2RAYA_VERSION="${{ steps.v2raya.outputs.version }}"
        V2RAY_VERSION="${{ steps.v2ray.outputs.version }}"
        XRAY_VERSION="${{ steps.xray.outputs.version }}"
        
        sed -i "s/- v2rayA Version: .*/- v2rayA Version: ${V2RAYA_VERSION}/" README.md
        sed -i "s/- v2ray-core Version: .*/- v2ray-core Version: ${V2RAY_VERSION}/" README.md
        sed -i "s/- xray-core Version: .*/- xray-core Version: ${XRAY_VERSION}/" README.md
        
    - name: Install fnpack
      if: steps.check.outputs.needs_update == 'true'
      run: |
        chmod +x build/fnpack-1.2.1-linux-amd64
        sudo cp build/fnpack-1.2.1-linux-amd64 /usr/local/bin/fnpack
        
    - name: Build fpk package
      if: steps.check.outputs.needs_update == 'true'
      run: |
        fnpack build
        # 获取生成的 fpk 文件名
        FPK_FILE=$(ls *.fpk | head -n 1)
        echo "fpk_file=${FPK_FILE}" >> $GITHUB_OUTPUT
        echo "FPK package built: ${FPK_FILE}"
      id: build
        
    - name: Upload fpk artifact
      if: steps.check.outputs.needs_update == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: v2rayA-${{ steps.v2raya.outputs.version }}.fpk
        path: ${{ steps.build.outputs.fpk_file }}
        retention-days: 30
        
    - name: Delete old pre-releases
      if: steps.check.outputs.needs_update == 'true' && (github.event_name == 'schedule' || github.event.inputs.create_release == 'true')
      run: |
        # 删除所有旧的 pre-release
        gh release list --limit 100 --json tagName,isPrerelease | jq -r '.[] | select(.isPrerelease == true) | .tagName' | while read tag; do
          echo "Deleting old pre-release: $tag"
          gh release delete "$tag" --yes || true
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create Pre-release
      if: steps.check.outputs.needs_update == 'true' && (github.event_name == 'schedule' || github.event.inputs.create_release == 'true')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.v2raya.outputs.version }}-pre
        name: v2rayA ${{ steps.v2raya.outputs.version }} (Pre-release)
        body: |
          ## 🚀 Auto-built Pre-release
          
          This version is automatically built and published by GitHub Actions.
          
          ### 📦 Update Details
          - v2rayA: ${{ steps.current.outputs.v2raya }} → ${{ steps.v2raya.outputs.version }}
          - v2ray-core: ${{ steps.v2ray.outputs.version }}
          - xray-core: ${{ steps.xray.outputs.version }}
          - Updated geoip.dat and geosite.dat files for both cores
          
          ### ⚠️ Notes
          - This is a pre-release version. Please test and verify first.
          
          ### 📋 Upstream Release Notes
          - [v2rayA Release Notes](https://github.com/v2rayA/v2rayA/releases/tag/v${{ steps.v2raya.outputs.version }})
          - [v2ray-core Release Notes](https://github.com/v2fly/v2ray-core/releases/tag/v${{ steps.v2ray.outputs.version }})
          - [xray-core Release Notes](https://github.com/XTLS/Xray-core/releases/tag/v${{ steps.xray.outputs.version }})
        files: ${{ steps.build.outputs.fpk_file }}
        prerelease: true
        draft: false
        
    - name: Commit and push changes
      if: steps.check.outputs.needs_update == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add app/ manifest README.md
        
        git diff --staged --quiet || git commit -m "chore: update to v2rayA ${{ steps.v2raya.outputs.version }}, v2ray-core ${{ steps.v2ray.outputs.version }} and xray-core ${{ steps.xray.outputs.version }}"
        git push
