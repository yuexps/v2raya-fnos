name: Build and Package v2rayA for fnOS

on:
  schedule:
    - cron: '0 16 * * 4' # 每周五 00:00 运行
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布 pre'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      force_build:
        description: '是否强制打包'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

permissions:
  contents: write
  pull-requests: write

env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-pack:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check for updates
      id: check
      env:
        FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
      run: |
        # 初始化 VERSION
        if [ ! -f VERSION ] || ! grep -q "v2raya=" VERSION; then
          printf "v2raya=\ngeosite_md5=\ngeoip_md5=\nloyalsoldier_md5=\nbuild_version=\n" > VERSION
        fi
        
        # 读取本地缓存
        LOCAL_V2RAYA=$(grep 'v2raya=' VERSION | cut -d'=' -f2 || echo "")
        LOCAL_GEOSITE=$(grep 'geosite_md5=' VERSION | cut -d'=' -f2 || echo "")
        LOCAL_GEOIP=$(grep 'geoip_md5=' VERSION | cut -d'=' -f2 || echo "")
        LOCAL_LOYAL=$(grep 'loyalsoldier_md5=' VERSION | cut -d'=' -f2 || echo "")
        
        # 获取官方最新正式版本号
        LATEST_TAG=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/v2rayA/v2rayA/releases/latest | jq -r '.tag_name')
        if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
          echo "获取最新版本号失败"
          exit 1
        fi
        
        echo "官方最新 v2rayA 版本: $LATEST_TAG"
        echo "本地缓存 v2rayA 版本: $LOCAL_V2RAYA"
        
        # 下载并计算最新 dat 哈希值
        mkdir -p temp_geo
        curl -sSL -o temp_geo/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
        curl -sSL -o temp_geo/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
        curl -sSL -o temp_geo/LoyalsoldierSite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/refs/heads/master/geosite.dat
        
        NEW_GEOSITE=$(md5sum temp_geo/geosite.dat | cut -d' ' -f1)
        NEW_GEOIP=$(md5sum temp_geo/geoip.dat | cut -d' ' -f1)
        NEW_LOYAL=$(md5sum temp_geo/LoyalsoldierSite.dat | cut -d' ' -f1)
        
        NEED_BUILD="false"
        
        # 检查是否需要构建
        if [ "$FORCE_BUILD" = "true" ]; then
          echo "手动触发强制打包"
          NEED_BUILD="true"
        elif [ "$LATEST_TAG" != "$LOCAL_V2RAYA" ]; then
          echo "v2rayA 有更新"
          NEED_BUILD="true"
        elif [ "$NEW_GEOSITE" != "$LOCAL_GEOSITE" ]; then
          echo "geosite.dat 有更新"
          NEED_BUILD="true"
        elif [ "$NEW_GEOIP" != "$LOCAL_GEOIP" ]; then
          echo "geoip.dat 有更新"
          NEED_BUILD="true"
        elif [ "$NEW_LOYAL" != "$LOCAL_LOYAL" ]; then
          echo "LoyalsoldierSite.dat 有更新"
          NEED_BUILD="true"
        fi
        
        # 更新 VERSION 并准备打包文件
        if [ "$NEED_BUILD" = "true" ]; then
          BUILD_VERSION=$(date +%y.%-m.%-d)
          printf "v2raya=${LATEST_TAG}\ngeosite_md5=${NEW_GEOSITE}\ngeoip_md5=${NEW_GEOIP}\nloyalsoldier_md5=${NEW_LOYAL}\nbuild_version=${BUILD_VERSION}\n" > VERSION
          
          mkdir -p fnpack/app/geo
          cp temp_geo/*.dat fnpack/app/geo/
          
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "v2raya_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "need_build=true" >> $GITHUB_OUTPUT
          echo "准备打包版本: ${BUILD_VERSION}"
        else
          echo "所有组件均无更新，跳过打包"
          echo "need_build=false" >> $GITHUB_OUTPUT
        fi
        rm -rf temp_geo

    - name: Download official v2rayA and v2rayA core binaries
      if: steps.check.outputs.need_build == 'true'
      run: |
        TAG="${{ steps.check.outputs.v2raya_tag }}"
        VERSION_NUM="${TAG#v}"
        mkdir -p fnpack/app/x86 fnpack/app/arm
        
        # 下载 x86 二进制
        curl -sSL -o fnpack/app/x86/v2raya "https://github.com/v2rayA/v2rayA/releases/download/${TAG}/v2raya_linux_x64_${VERSION_NUM}"
        curl -sSL -o fnpack/app/x86/v2raya_core "https://github.com/v2rayA/v2rayA/releases/download/${TAG}/v2raya_core_linux_x64_${VERSION_NUM}"
        chmod +x fnpack/app/x86/v2raya fnpack/app/x86/v2raya_core
        
        # 下载 arm64 二进制
        curl -sSL -o fnpack/app/arm/v2raya "https://github.com/v2rayA/v2rayA/releases/download/${TAG}/v2raya_linux_arm64_${VERSION_NUM}"
        curl -sSL -o fnpack/app/arm/v2raya_core "https://github.com/v2rayA/v2rayA/releases/download/${TAG}/v2raya_core_linux_arm64_${VERSION_NUM}"
        chmod +x fnpack/app/arm/v2raya fnpack/app/arm/v2raya_core

    - name: Pack FPK Packages
      if: steps.check.outputs.need_build == 'true'
      id: pack
      run: |
        DATE_VERSION="${{ steps.check.outputs.version }}"
        
        # 赋予 fnpack 工具执行权限并安装到系统路径
        chmod +x fnpack/fnpack-1.2.1-linux-amd64
        sudo cp fnpack/fnpack-1.2.1-linux-amd64 /usr/local/bin/fnpack
        
        # 复制为不同架构的专属打包目录
        cp -r fnpack fnpack_x86
        cp -r fnpack fnpack_arm
        
        # 打包 x86 版本
        echo "Building x86 package..."
        rm -rf fnpack_x86/app/arm
        sed -i "s/^platform.*/platform        = x86/" fnpack_x86/manifest
        sed -i "s/^version.*/version         = ${DATE_VERSION}/" fnpack_x86/manifest
        
        cd fnpack_x86
        fnpack build
        FPK_X86=$(ls *.fpk | head -n 1)
        mv "${FPK_X86}" "../v2raya_x86.fpk"
        cd ..
        
        # 打包 arm 版本
        echo "Building arm package..."
        rm -rf fnpack_arm/app/x86
        sed -i "s/^platform.*/platform        = arm/" fnpack_arm/manifest
        sed -i "s/^version.*/version         = ${DATE_VERSION}/" fnpack_arm/manifest
        
        cd fnpack_arm
        fnpack build
        FPK_ARM=$(ls *.fpk | head -n 1)
        mv "${FPK_ARM}" "../v2raya_arm.fpk"
        cd ..
        
        # 清理临时打包目录
        rm -rf fnpack_x86 fnpack_arm
        
        echo "x86_fpk=v2raya_x86.fpk" >> $GITHUB_OUTPUT
        echo "arm_fpk=v2raya_arm.fpk" >> $GITHUB_OUTPUT

    - name: Upload x86 Artifact
      if: steps.check.outputs.need_build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: v2raya-${{ steps.check.outputs.version }}-x86
        path: ${{ steps.pack.outputs.x86_fpk }}
        retention-days: 30

    - name: Upload arm Artifact
      if: steps.check.outputs.need_build == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: v2raya-${{ steps.check.outputs.version }}-arm
        path: ${{ steps.pack.outputs.arm_fpk }}
        retention-days: 30

    - name: Update manifest version in repository
      if: steps.check.outputs.need_build == 'true'
      run: |
        DATE_VERSION="${{ steps.check.outputs.version }}"
        # 始终更新主仓库 manifest 中的 App 包版本号
        sed -i "s/^version.*/version         = ${DATE_VERSION}/" fnpack/manifest

    - name: Delete old pre-releases
      if: steps.check.outputs.need_build == 'true' && (github.event_name == 'schedule' || github.event.inputs.create_release == 'true')
      run: |
        # 删除所有旧的 pre-release 标签，保持 Release 干净
        gh release list --limit 100 --json tagName,isPrerelease | jq -r '.[] | select(.isPrerelease == true) | .tagName' | while read tag; do
          echo "Deleting old pre-release: $tag"
          gh release delete "$tag" --yes --cleanup-tag || true
        done

    - name: Create Pre-release
      if: steps.check.outputs.need_build == 'true' && (github.event_name == 'schedule' || github.event.inputs.create_release == 'true')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v${{ steps.check.outputs.version }}-pre
        name: v2rayA for fnOS ${{ steps.check.outputs.version }}
        body: |
          ## Auto-built Dedicated Pre-release
          
          This version is automatically packaged by GitHub Actions.
          
          *Built on: ${{ steps.check.outputs.version }}*
        files: |
          ${{ steps.pack.outputs.x86_fpk }}
          ${{ steps.pack.outputs.arm_fpk }}
        prerelease: true
        draft: false

    - name: Commit and push changes
      if: steps.check.outputs.need_build == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add fnpack/manifest fnpack/app/geo/ VERSION
        
        DATE_VERSION="${{ steps.check.outputs.version }}"
        COMMIT_MSG="chore: auto update manifest and geo to version ${DATE_VERSION} [skip ci]"
        
        git diff --staged --quiet || git commit -m "$COMMIT_MSG"
        git push
